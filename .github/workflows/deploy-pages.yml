name: نشر الموقع على GitHub Pages

on:
  push:
    branches:
      - main
      - claude/amazing-darwin-QcjqB
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# يسمح بنشر واحد متزامن فقط
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تهيئة Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
